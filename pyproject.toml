[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "SilicaAnimus"
version = "1.1.0"
description = "Le bot du serveur Discord de la voie du Thalos"

readme = "README.md"
requires-python = ">=3.8"
keywords = ["discord", "HelloAsso"]
authors = [
  {name = "Patator", email = "lmpatator@gmail.com" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "discord.py",
  "typer",
  "python-dotenv",
  "pytest",
  "pytest-asyncio",
  "pre-commit",
  "google-api-python-client",
  "unidecode>=1.4.0",
  "ipykernel>=6.29.5",
]

[project.scripts]
SilicaAnimus = "SilicaAnimus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["FA100", "FA102", "N999"]

[dependency-groups]
dev = [
    "ipympl>=0.9.3",
    "jupyterlab>=4.3.8",
    "jupytext>=1.17.1",
    "matplotlib>=3.7.5",
    "pandas>=2.0.3",
    "pytest>=8.3.5",
    "ruff>=0.16.0",
    "tabulate>=0.9.0",
]
test = [
    "pytest>=8.3.5",
]
